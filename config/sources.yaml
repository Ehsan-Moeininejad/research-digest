# مقالات علمی از arXiv (رایگان، جدیدترین‌ها اول)
# سینتکس: all: / abs: / ti: / cat: با AND / OR / ANDNOT
arxiv:
  - { name: "arXiv · Advertising",      query: "abs:advertising AND (cat:cs.IR OR cat:cs.LG OR cat:econ.GN)", hint: performance }
  - { name: "arXiv · Uplift & Causal",  query: "abs:uplift AND (abs:marketing OR abs:coupon OR abs:incentive)", hint: data }
  - { name: "arXiv · E-commerce RecSys",query: "abs:e-commerce AND abs:recommendation AND cat:cs.IR",         hint: commerce }
  - { name: "arXiv · Retention",        query: "abs:churn OR (abs:customer AND abs:retention)",                hint: ecrm }
  - { name: "arXiv · Promotions",       query: "(abs:promotion OR abs:coupon OR abs:discount) AND (abs:e-commerce OR abs:retail OR abs:marketing)", hint: campaign }
  - { name: "arXiv · LLM for Marketing",query: "(abs:LLM OR abs:agent) AND (abs:marketing OR abs:advertising OR abs:e-commerce)", hint: ai }
  - { name: "arXiv · Platforms & Econ", query: "cat:econ.GN AND (abs:platform OR abs:marketplace OR abs:pricing)", hint: management }

arxiv_max_results: 40
