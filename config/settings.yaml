  performance: { fa: "پرفورمنس و تبلیغات", en: "Performance & Ads",    color: "#0097A7" }
  campaign:    { fa: "کمپین و پروموشن",    en: "Campaigns & Promotions", color: "#F57C00" }
  growth:      { fa: "رشد",                 en: "Growth",                color: "#2E9E4F" }
  ecrm:        { fa: "eCRM و وفاداری",     en: "eCRM & Retention",      color: "#8E44AD" }
  data:        { fa: "داده و آزمایش",       en: "Data & Experimentation", color: "#1E88E5" }
  ai:          { fa: "هوش مصنوعی",          en: "AI & Agents",           color: "#6A4BC4" }
