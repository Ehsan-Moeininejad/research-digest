name: daily-digest

on:
  # هر روز 05:00 UTC = 08:30 تهران؛ با تأخیر GitHub و زمان اجرا، خروجی قبل از ساعت 10 آماده است
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "بازسازی دایجست امروز حتی اگر قبلاً ساخته شده"
        type: boolean
        default: false

permissions:
  contents: write
  models: read        # GitHub Models: free LLM using the workflow's own token

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          FORCE: ${{ inputs.force }}
        run: python digest/main.py

      - name: Commit & push
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "digest: $(TZ=Asia/Tehran date +%F)"
          git push
